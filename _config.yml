url: https://fmarslan.com
baseurl: ""
repository: fmarslan/fmarslan.github.io
locale: "en-US"
title: "Fatih Mehmet Arslan"
alternate_name: fmarslan
description: >
  Technical notes on software architecture, distributed systems, cloud platforms, and engineering.
keywords:
  - Fatih Mehmet Arslan
  - solution architect
  - software engineer
  - cloud architecture
social:
  name: "Fatih Mehmet Arslan"
  links:
    - https://www.linkedin.com/in/fmarslan
    - https://github.com/fmarslan
    - https://fmarslan.medium.com

author:
  name: Fatih Mehmet Arslan
  email: contact@fmarslan.com
  type: person
  job_title: Software Engineer

share_image: /android-chrome-512x512.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /:categories/:year/:month/:day/:title:output_ext
paginate: 20
paginate_path: /blog/:num
show_excerpts: true
google_analytics: G-ZPHHT8GE5Z
future: true

sass:
  sass_dir: _sass
  style: compressed

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      lang: tr-TR
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
      lang: tr-TR

navigation_tr:
  - title: Ana Sayfa
    url: /tr/
  - title: Blog
    url: /blog/
  - title: Hakkımda
    url: /about/
  - title: Özgeçmiş
    url: /cv/
  - title: Teknolojiler
    url: /teknolojiler/

navigation_en:
  - title: Home
    url: /
  - title: Blog
    url: /en/blog/
  - title: About
    url: /en/about/
  - title: Resume
    url: /en/cv/
  - title: Technologies
    url: /en/technologies/

exclude:
  - scripts
  - Dockerfile
  - compose.yml
  - docs
  - assets/img/tools/README.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - _site
  - tmp
  - tests
